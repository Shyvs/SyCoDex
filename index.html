<!DOCTYPE html>
<html>

<head>
    <title>SyCoDex</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

<h1>SyCoDex</h1>

<p>Enter a name to discover a SyCoMon:</p>


<input id="nameInput" placeholder="Enter name">

<button id="searchButton" onclick="generate()">Search!</button>

<button id="logButton" onclick="logSighting()" style="display:none;">
    Log Sighting!
</button>


<div id="sycomonCard">

    <div class="leftColumn">

        <h2 id="sycomonName"></h2>


        <div class="imageBox">

            <span>?</span>

        </div>


      <div class="typeRarity">

    <div id="sycomonType"></div>

    <div id="sycomonRarity"></div>

</div>

        <div class="discoveryInfo">

            <p>
                Discovered by:
                <span id="sycomonDiscovery">
                    Undiscovered
                </span>
            </p>

            <p>
                Logs:
                <span id="sycomonLogs">
                    0
                </span>
                |
                Captures:
                <span id="sycomonCaptures">
                    0
                </span>
                |
                Evolutions:
                <span id="sycomonEvolutions">
                    0
                </span>
            </p>

        </div>


    </div>



    <div class="rightColumn">


        <div class="infoBox">

            <h3>Appearance</h3>

            <p id="sycomonAppearance"></p>


            <h3>Colors</h3>

            <p id="sycomonColors"></p>

        </div>



        <div class="infoBox">

            <h3>Behaviour</h3>

            <p id="sycomonBehavior"></p>


            <h3>Personality</h3>

            <p id="sycomonPersonality"></p>


            <h3>Habitat</h3>

            <p id="sycomonHabitat"></p>

        </div>


    </div>


</div>



<!-- Data files first -->
<script src="js/data/types.js"></script>

<script src="js/data/traits/body.js"></script>
<script src="js/data/traits/materials.js"></script>
<script src="js/data/traits/features.js"></script>
<script src="js/data/traits/details.js"></script>

<script src="js/data/flavor.js"></script>


<!-- Utility files -->
<script src="js/random.js"></script>
<script src="js/rarity.js"></script>


<!-- Generator last -->
<script src="js/generator.js"></script>


<!-- Website controls -->
<script src="js/script.js"></script>


</body>

</html>
